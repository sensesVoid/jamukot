<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jamukot — Music Player</title>
<meta name="description" content="Aesthetic web music player hosted on GitHub Pages." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=11" />
</head>
<body>
  <div class="bg-orbs">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">JAMUKOT</span>
    </div>
    <div class="storage-indicator" id="storage-indicator">
      <span class="storage-label">Storage</span>
      <div class="storage-bar"><div class="storage-fill" id="storage-fill"></div></div>
      <span class="storage-text" id="storage-text">0 / 9.5 GB</span>
    </div>
  </header>

  <main class="app">
    <!-- PLAYER VIEW -->
    <section class="view view-player active" id="view-player">
      <div class="player-grid">
        <!-- Left: playlist -->
        <aside class="panel playlist-panel">
          <div class="panel-head">
            <h2>Playlist</h2>
            <span class="count" id="track-count">0 tracks</span>
          </div>
          <div class="search-box">
            <input type="text" id="search" placeholder="Search tracks…" />
          </div>
          <ul class="track-list" id="track-list"></ul>
        </aside>

        <!-- Center: now playing + vinyl -->
        <section class="panel nowplaying-panel">
          <div class="vinyl-wrap">
            <div class="vinyl" id="vinyl">
              <div class="vinyl-grooves"></div>
              <div class="vinyl-label" id="vinyl-label">
                <img id="cover-img" alt="cover" loading="lazy" decoding="async" />
                <div class="cover-fallback" id="cover-fallback"></div>
              </div>
              <div class="vinyl-shine"></div>
            </div>
            <div class="tonearm" id="tonearm">
              <div class="tonearm-base"></div>
              <div class="tonearm-arm"></div>
              <div class="tonearm-head"></div>
            </div>
          </div>
          <div class="np-meta">
            <div class="np-title" id="np-title">Select a track</div>
            <div class="np-artist" id="np-artist">—</div>
          </div>

          <div class="progress">
            <span class="time" id="cur-time">0:00</span>
            <div class="progress-bar" id="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
              <div class="progress-thumb" id="progress-thumb"></div>
            </div>
            <span class="time" id="dur-time">0:00</span>
          </div>

          <div class="controls">
            <button class="ctrl-btn" id="btn-shuffle" title="Shuffle">⤮</button>
            <button class="ctrl-btn" id="btn-prev" title="Previous">⏮</button>
            <button class="ctrl-btn play-btn" id="btn-play" title="Play/Pause">▶</button>
            <button class="ctrl-btn" id="btn-next" title="Next">⏭</button>
            <button class="ctrl-btn" id="btn-repeat" title="Repeat">↻</button>
          </div>

          <div class="volume-row">
            <span class="vol-icon">🔊</span>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
          </div>
        </section>

        <!-- Right: lyrics -->
        <aside class="panel lyrics-panel" id="lyrics-panel">
          <div class="panel-head">
            <h2>Lyrics</h2>
            <span class="badge" id="lyrics-status">idle</span>
          </div>
          <div class="offset-row">
            <label>Sync offset: <span id="offset-val">0.0s</span></label>
            <input type="range" id="lyric-offset" min="-60" max="60" step="0.5" value="0" />
          </div>
          <div class="lyrics-note" id="lyrics-note"></div>
          <div class="lyrics-scroll" id="lyrics-scroll">
            <div class="lyrics-empty" id="lyrics-empty">
              Play a track to load synced lyrics from LRCLIB.
            </div>
            <ul class="lyrics-list" id="lyrics-list"></ul>
          </div>
        </aside>
      </div>
    </section>


  </main>

  <audio id="audio" preload="metadata"></audio>

  <script src="js/app.js?v=11"></script>
</body>
</html>
